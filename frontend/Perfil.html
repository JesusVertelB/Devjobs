<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Actualiza tu información personal y profesional en DevJobs.">
  <title>Mi perfil | DevJobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tailwind.css">
</head>

<body class="profile-layout">
  <div class="profile-page">
    <aside class="profile-sidebar" aria-label="Navegación de cuenta">
      <a class="profile-identity" href="Perfil.html">
        <span class="profile-avatar" id="profile-avatar" aria-hidden="true">DJ</span>
        <span>
          <strong id="sidebar-name">Mi perfil</strong>
          <small id="sidebar-role">Candidato/a</small>
        </span>
      </a>

      <nav class="profile-nav">
        <a href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
          Inicio
        </a>
        <a href="Perfil.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M5 21v-2a7 7 0 0 1 14 0v2z" />
          </svg>
          Mi perfil
        </a>
        <a href="Empleos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <rect x="3" y="7" width="18" height="14" rx="2" />
            <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18m-11 0v2h4v-2" />
          </svg>
          Explorar empleos
        </a>
      </nav>

      <button class="profile-signout" id="sign-out" type="button">Cerrar sesión</button>
    </aside>

    <main class="profile-content">
      <header class="profile-heading">
        <h1>Mi perfil</h1>
        <p>Actualiza tu información personal y profesional</p>
      </header>

      <form class="profile-form" id="profile-form">
        <section class="profile-section" aria-labelledby="personal-title">
          <h2 id="personal-title">Información personal</h2>
          <div class="profile-fields">
            <label>
              Nombre
              <input id="full-name" name="fullName" type="text" autocomplete="name" maxlength="120" required>
            </label>
            <label>
              Correo electrónico
              <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
            </label>
            <label>
              Ubicación
              <input id="location" name="location" type="text" autocomplete="address-level2" maxlength="160">
            </label>
            <label class="profile-field-wide">
              Sobre mí
              <textarea id="about" name="about" rows="4" maxlength="2000"></textarea>
            </label>
          </div>
        </section>

        <section class="profile-section" aria-labelledby="experience-title">
          <h2 id="experience-title">Experiencia</h2>
          <div class="profile-fields">
            <label>
              Cargo
              <input id="job-title" name="jobTitle" type="text" maxlength="120">
            </label>
            <label>
              Empresa
              <input id="company" name="company" type="text" maxlength="160">
            </label>
            <label>
              Años de experiencia
              <input id="experience-years" name="experienceYears" type="number" min="0" max="60" step="1">
            </label>
          </div>
        </section>

        <section class="profile-section" aria-labelledby="skills-title">
          <h2 id="skills-title">Habilidades</h2>
          <label class="profile-skills-label" for="skills">Separadas por comas</label>
          <input id="skills" name="skills" type="text" maxlength="900" placeholder="JavaScript, React, Node.js">
          <div class="profile-skill-list" id="skill-preview" aria-label="Vista previa de habilidades"></div>
        </section>

        <section class="profile-section profile-resume-section" aria-labelledby="resume-title">
          <h2 id="resume-title">CV</h2>
          <input id="resume-file" class="profile-file-input" type="file" accept=".pdf,.doc,.docx">
          <label class="profile-upload" id="resume-dropzone" for="resume-file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M12 16V4m0 0L7 9m5-5 5 5" />
              <path d="M20 16.5a4.5 4.5 0 0 0-3.5-4.39A5.5 5.5 0 0 0 6 13a3.5 3.5 0 0 0 .5 7H18a3 3 0 0 0 2-3.5Z" />
            </svg>
            <strong id="resume-prompt">Sube tu CV o arrastra y suelta</strong>
            <span>PDF, DOC o DOCX (máx. 5 MB)</span>
          </label>
          <div class="profile-resume-actions" id="resume-actions" hidden>
            <span id="resume-name"></span>
            <button type="button" id="download-resume">Descargar</button>
            <button type="button" id="remove-resume">Quitar</button>
          </div>
        </section>

        <div class="profile-form-actions">
          <p class="profile-status" id="profile-status" role="status" aria-live="polite" hidden></p>
          <button class="profile-save" type="submit">Guardar cambios</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const form = document.querySelector('#profile-form');
    const statusMessage = document.querySelector('#profile-status');
    const resumeInput = document.querySelector('#resume-file');
    const resumeDropzone = document.querySelector('#resume-dropzone');
    const resumeActions = document.querySelector('#resume-actions');
    const resumeName = document.querySelector('#resume-name');
    const resumePrompt = document.querySelector('#resume-prompt');
    const skillInput = document.querySelector('#skills');
    const skillPreview = document.querySelector('#skill-preview');
    const defaultSkills = ['JavaScript', 'React', 'Node.js', 'HTML', 'CSS'];
    let savedResumeName = '';
    let selectedResume = null;
    let removeSavedResume = false;

    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.classList.toggle('is-error', isError);
      statusMessage.hidden = false;
    }

    function initials(name) {
      return name.trim().split(/\s+/).slice(0, 2).map((part) => part[0] || '').join('').toLocaleUpperCase('es');
    }

    function updateSkillPreview() {
      const skills = [...new Set(skillInput.value.split(',').map((skill) => skill.trim()).filter(Boolean))];
      skillPreview.replaceChildren(...skills.map((skill) => {
        const chip = document.createElement('span');
        chip.className = 'profile-skill-chip';
        chip.textContent = skill;
        return chip;
      }));
    }

    function showResume(name) {
      const hasResume = Boolean(name || selectedResume);
      resumeActions.hidden = !hasResume;
      resumeDropzone.classList.toggle('has-file', hasResume);
      resumeName.textContent = selectedResume ? selectedResume.name : name;
      resumePrompt.textContent = selectedResume ? 'CV listo para guardar' : name || 'Sube tu CV o arrastra y suelta';
      document.querySelector('#download-resume').hidden = !savedResumeName || Boolean(selectedResume) || removeSavedResume;
    }

    async function readResume(file) {
      const extension = file.name.toLowerCase().split('.').pop();
      const types = {
        pdf: 'application/pdf',
        doc: 'application/msword',
        docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      };
      if (!types[extension] || file.size > 5 * 1024 * 1024 || file.size === 0) {
        showStatus('Sube un CV PDF, DOC o DOCX de máximo 5 MB.', true);
        resumeInput.value = '';
        return;
      }
      selectedResume = { file, type: types[extension] };
      removeSavedResume = false;
      showResume(savedResumeName);
      statusMessage.hidden = true;
    }

    function redirectToLogin() {
      sessionStorage.removeItem('devjobs-token');
      sessionStorage.removeItem('devjobs-user');
      window.location.replace('IniciarSesion.html?returnTo=Perfil.html');
    }

    async function loadProfile() {
      const token = sessionStorage.getItem('devjobs-token');
      if (!token) {
        redirectToLogin();
        return;
      }

      try {
        const authResponse = await fetch('/api/auth/me', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (authResponse.status === 401) {
          redirectToLogin();
          return;
        }
        if (!authResponse.ok) throw new Error('No pudimos verificar tu sesión.');
        const { user } = await authResponse.json();
        if (user.account_type !== 'candidate') {
          window.location.replace('PublicarEmpleo.html');
          return;
        }
        sessionStorage.setItem('devjobs-user', JSON.stringify(user));
        document.querySelector('#sidebar-name').textContent = user.full_name.split(/\s+/)[0];
        document.querySelector('#profile-avatar').textContent = initials(user.full_name);

        const response = await fetch('/api/profile', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const result = await response.json();
        if (response.status === 401) {
          redirectToLogin();
          return;
        }
        if (!response.ok) throw new Error(result.error || 'No pudimos cargar tu perfil.');
        const profile = result.profile;
        form.elements.fullName.value = profile.fullName;
        form.elements.email.value = profile.email;
        form.elements.location.value = profile.location;
        form.elements.about.value = profile.about;
        form.elements.jobTitle.value = profile.jobTitle;
        form.elements.company.value = profile.company;
        form.elements.experienceYears.value = profile.experienceYears;
        document.querySelector('#sidebar-role').textContent = profile.jobTitle || 'Candidato/a';
        skillInput.value = (profile.skills.length ? profile.skills : defaultSkills).join(', ');
        savedResumeName = profile.resumeName;
        showResume(savedResumeName);
        updateSkillPreview();
      } catch (error) {
        showStatus(error.message || 'No pudimos cargar tu perfil. Inténtalo de nuevo.', true);
      }
    }

    skillInput.addEventListener('input', updateSkillPreview);
    form.elements.fullName.addEventListener('input', (event) => {
      document.querySelector('#sidebar-name').textContent = event.currentTarget.value.trim().split(/\s+/)[0] || 'Mi perfil';
      document.querySelector('#profile-avatar').textContent = initials(event.currentTarget.value) || 'DJ';
    });

    resumeInput.addEventListener('change', () => {
      if (resumeInput.files[0]) readResume(resumeInput.files[0]);
    });
    resumeDropzone.addEventListener('dragover', (event) => {
      event.preventDefault();
      resumeDropzone.classList.add('is-dragging');
    });
    resumeDropzone.addEventListener('dragleave', () => resumeDropzone.classList.remove('is-dragging'));
    resumeDropzone.addEventListener('drop', (event) => {
      event.preventDefault();
      resumeDropzone.classList.remove('is-dragging');
      const [file] = event.dataTransfer.files;
      if (file) readResume(file);
    });

    document.querySelector('#remove-resume').addEventListener('click', () => {
      selectedResume = null;
      removeSavedResume = Boolean(savedResumeName);
      resumeInput.value = '';
      showResume('');
    });

    document.querySelector('#download-resume').addEventListener('click', async () => {
      try {
        const response = await fetch('/api/profile/resume', {
          headers: { Authorization: `Bearer ${sessionStorage.getItem('devjobs-token')}` }
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(result.error || 'No pudimos descargar el CV.');
        }
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement('a');
        link.href = url;
        link.download = savedResumeName;
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        showStatus(error.message || 'No pudimos descargar el CV.', true);
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const token = sessionStorage.getItem('devjobs-token');
      const submit = form.querySelector('[type="submit"]');
      const body = {
        fullName: form.elements.fullName.value,
        email: form.elements.email.value,
        location: form.elements.location.value,
        about: form.elements.about.value,
        jobTitle: form.elements.jobTitle.value,
        company: form.elements.company.value,
        experienceYears: form.elements.experienceYears.value === '' ? null : Number(form.elements.experienceYears.value),
        skills: [...new Set(skillInput.value.split(',').map((skill) => skill.trim()).filter(Boolean))]
      };
      submit.disabled = true;
      submit.textContent = 'Guardando...';
      statusMessage.hidden = true;

      try {
        if (selectedResume) {
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error('No pudimos leer el archivo del CV.'));
            reader.readAsDataURL(selectedResume.file);
          });
          body.resume = {
            name: selectedResume.file.name,
            type: selectedResume.type,
            data: dataUrl.split(',')[1]
          };
        } else if (removeSavedResume) {
          body.removeResume = true;
        }

        const response = await fetch('/api/profile', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (response.status === 401) {
          redirectToLogin();
          return;
        }
        if (!response.ok) throw new Error(result.error || 'No pudimos guardar los cambios.');
        savedResumeName = result.profile.resumeName ?? savedResumeName;
        selectedResume = null;
        removeSavedResume = false;
        resumeInput.value = '';
        document.querySelector('#sidebar-role').textContent = result.profile.jobTitle || 'Candidato/a';
        sessionStorage.setItem('devjobs-user', JSON.stringify({
          ...JSON.parse(sessionStorage.getItem('devjobs-user') || '{}'),
          full_name: result.profile.fullName,
          email: result.profile.email
        }));
        showResume(savedResumeName);
        showStatus('Tu perfil se guardó correctamente.');
      } catch (error) {
        showStatus(error.message || 'No pudimos guardar los cambios. Inténtalo de nuevo.', true);
      } finally {
        submit.disabled = false;
        submit.textContent = 'Guardar cambios';
      }
    });

    document.querySelector('#sign-out').addEventListener('click', () => {
      sessionStorage.removeItem('devjobs-token');
      sessionStorage.removeItem('devjobs-user');
      window.location.assign('IniciarSesion.html');
    });

    loadProfile();
  </script>
</body>

</html>
